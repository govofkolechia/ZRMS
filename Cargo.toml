[workspace]
resolver = "2"
members = [
    "crates/zrms-core",
    "crates/zrms-protocol",
    "crates/zrms-controller",
    "crates/zyfin-agent",
    "crates/zrms-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
